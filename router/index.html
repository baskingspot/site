<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>baskingspot</title>
    <meta
      name="description"
      content="Zig is cold-blooded. Come bask. Libraries between std and your application."
    />
    <link rel="canonical" href="https://baskingspot.dev/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16191d" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="baskingspot" />
    <meta property="og:url" content="https://baskingspot.dev/" />
    <meta property="og:title" content="baskingspot" />
    <meta
      property="og:description"
      content="Zig is cold-blooded. Come bask. Libraries between std and your application."
    />
    <meta property="og:image" content="https://baskingspot.dev/social.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="baskingspot" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #16191d;
        --paper: #f4f1ec;
        --heat: #d4412b;
        --bg: light-dark(var(--paper), var(--ink));
        --fg: light-dark(var(--ink), var(--paper));
        --muted: light-dark(#58616c, #a3abb5);
        --link-hover: light-dark(#b8321d, #e8604a);
        --rule: color-mix(in srgb, var(--fg) 18%, transparent);
      }
      body {
        margin: 0 auto;
        max-width: 40rem;
        padding: 4rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font:
          1.125rem/1.55 system-ui,
          sans-serif;
      }
      ::selection {
        background: color-mix(in srgb, var(--heat) 30%, transparent);
      }
      img {
        height: 56px;
      }
      p {
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration-color: var(--heat);
        text-decoration-thickness: 2px;
        text-underline-offset: 0.2em;
      }
      a:hover {
        color: var(--link-hover);
      }
      .tagline {
        margin-top: 2.5rem;
        font-size: 1.75rem;
        line-height: 1.25;
      }
      .what {
        margin-top: 0.5rem;
        color: var(--muted);
      }
      h2 {
        margin: 3rem 0 0;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--rule);
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 1.1rem 0;
        border-bottom: 1px solid var(--rule);
      }
      li a {
        font-size: 1.25rem;
        font-weight: 600;
      }
      li p {
        margin-top: 0.25rem;
        color: var(--muted);
        font-size: 1rem;
      }
      footer {
        margin-top: 2.5rem;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="/logo-dark.svg" />
      <img src="/logo.svg" alt="baskingspot" />
    </picture>
    <p class="tagline">Zig is cold-blooded. Come bask.</p>
    <p class="what">Libraries between std and your application.</p>
    <h2>Libraries</h2>
    <ul>
      <!-- sites -->
    </ul>
    <footer><a href="https://github.com/baskingspot">github.com/baskingspot</a></footer>
  </body>
</html>
