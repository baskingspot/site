<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16191d" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #16191d;
        --paper: #f4f1ec;
        --heat: #d4412b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1.5rem;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        font:
          1.125rem/1.5 system-ui,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: var(--ink);
          color: var(--paper);
        }
      }
      img {
        height: 56px;
      }
      p {
        margin: 0;
      }
      .tagline {
        font-size: 1.75rem;
        line-height: 1.25;
      }
      .what {
        opacity: 0.75;
        margin-top: -1rem;
      }
      .links {
        font-size: 1rem;
      }
      a {
        color: var(--heat);
      }
    </style>
  </head>
  <body>
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="/logo-dark.svg" />
      <img src="/logo.svg" alt="baskingspot" />

    <p class="tagline">Zig is cold-blooded. Come bask.</p>
    <p class="what">Libraries between std and your application.</p>
