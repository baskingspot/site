name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/ci.yml@79e6fa0dd9aea0cb438ff7dcb74c987885ecfe77 # v0.7.0
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Deploys the router after CI passes on main. The token is scoped to the
  # router's Worker only, and Terraform put it in this repo's secrets.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/deploy-docs.yml@79e6fa0dd9aea0cb438ff7dcb74c987885ecfe77 # v0.7.0
    with:
      recipe: deploy
      account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
