name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/ci.yml@659eb9c9a704cb8d5512565eac7f771a6b3325e6 # v0.12.2
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Deploys the router after CI passes on main. The token is scoped to the
  # router's Worker only, and Terraform put it in this repo's secrets.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/deploy-docs.yml@659eb9c9a704cb8d5512565eac7f771a6b3325e6 # v0.12.2
    with:
      recipe: deploy
      account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Deploys the Zig mirror with its own token, which is scoped to the mirror's
  # Worker. It runs beside the router deploy, not after it.
  deploy-mirror:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/deploy-docs.yml@659eb9c9a704cb8d5512565eac7f771a6b3325e6 # v0.12.2
    with:
      recipe: deploy-mirror
      account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MIRROR }}
